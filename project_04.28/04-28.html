<!DOCTYPE html>
<html lang="en">
<head>
    <title>영화</title>

    <style>
        div{
            box-sizing : border-box;
        }
        #wrap{
            width : 1200px;
            height : 500px;
            margin : auto;
            box-shadow: 1px 2px 12px lightgrey
        }
        .card{
            width: 240px;
            height: 360px;
            padding-bottom: 10px;
            display: inline-block;

            &:hover{
                box-shadow: 1px 2px 6px lightgrey;
            }
        }
        .card img{
            width: 100%;
            height: 300px;
        }
        .card h4{
            font-weight: 600px;
            font-size: 17px;
        }
        .card p{
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 
        실습 

        주제를 하나 정해서 ↑웹툰 목록을 출력했던 것처럼
        자바스크립트의 객체 배열을 만들어서
        객체가 가지고 있는 속성 값을 반복문을 이용해서 화면상에 출력하시오.
    -->

    <div id="wrap"></div>
    <button onclick="movie();">영화 목록</button>

    <script>
        function movie(){

            const movies = [
                {
                    "image" : "https://search.pstatic.net/common?quality=75&direct=true&src=https%3A%2F%2Fmovie-phinf.pstatic.net%2F20240222_175%2F1708609058134r4oaq_JPEG%2Fmovie_image.jpg",
                    "title" : "파묘",
                    "director" : "장재현",
                    "actor" : "최민식, 김고은, 유해진, 이도현"
                },
                {
                    "image" : "https://search.pstatic.net/common?quality=75&direct=true&src=https%3A%2F%2Fmovie-phinf.pstatic.net%2F20240425_256%2F17140073560223JK9r_JPEG%2Fmovie_image.jpg",
                    "title" : "범죄도시4",
                    "director" : "허명행",
                    "actor" : "마동석, 김무열, 박지환"
                },
                {
                    "image" : "https://search.pstatic.net/common?quality=75&direct=true&src=https%3A%2F%2Fmovie-phinf.pstatic.net%2F20240207_151%2F1707288437263gBsdd_JPEG%2Fmovie_image.jpg",
                    "title" : "듄: 파트2",
                    "director" : "드니 빌뇌브",
                    "actor" : "티모시 샬라메, 젠데이아, 레베카 퍼거슨"
                },
                {
                    "image" : "https://search.pstatic.net/common?quality=75&direct=true&src=https%3A%2F%2Fmovie-phinf.pstatic.net%2F20240311_85%2F1710136183535z3QfC_JPEG%2Fmovie_image.jpg",
                    "title" : "쿵푸팬더4",
                    "director" : "마이크 미첼",
                    "actor" : "잭 블랙, 아콰피나"
                },
                {
                    "image" : "https://search.pstatic.net/common?quality=75&direct=true&src=https%3A%2F%2Fmovie-phinf.pstatic.net%2F20240319_171%2F1710813949824uU0az_JPEG%2Fmovie_image.jpg",
                    "title" : "고질라 X 콩: 뉴 엠파이어",
                    "director" : "아담 윈가드",
                    "actor" : "레베카 홀, 브라이언 타이리 헨리"
                }
            ];
            console.log(movies);

            let el = '';
            for(let movie of movies){
                el += `<div class="card">
                    <image src=${movie.image} />
                    <h4>${movie.title}</h4>
                    <p>${movie.director}</p>
                    <p>${movie.actor}</p>
                    </div>`
            }

            document.querySelector('#wrap').innerHTML = el;




        }
    </script>




    
</body>
</html>
